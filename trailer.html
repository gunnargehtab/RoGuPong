<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoGuPong Trailer</title>
<meta name="description" content="RoGuPong in 17 seconds: a 16-bit pong duel for two phones on the same WiFi. RO vs GU, four stages, no server.">
<meta name="theme-color" content="#0b0616">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0616'/><rect x='2' y='12' width='6' height='2' fill='%23ff4d3d'/><rect x='8' y='2' width='6' height='2' fill='%233da5ff'/><rect x='7' y='7' width='2' height='2' fill='%23ffd93b'/></svg>">
<style>
/* One full-screen canvas carries the trailer; the page around it is the
   game's own console UI: its tokens, its gold buttons, its monospace. */
:root {
  --ink: #f4ecff;
  --dim: #a99cc8;
  --bg0: #0b0616;
  --bg2: #2b1350;
  --edge: #ffffff;
  --shadow: #05020c;
  --gold: #ffd93b;
  --gold-dark: #c14e07;
  --bar: rgba(11, 6, 22, 0.82);
  --font: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg0);
  color: var(--ink);
  font-family: var(--font);
  overscroll-behavior: none;
}

#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  image-rendering: pixelated;
  cursor: pointer;
}
body.idle #screen { cursor: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------------- buttons, as in the game ---------------- */

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 14px 22px;
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: none;
  color: #2a0f00;
  background: linear-gradient(#ffe98a, var(--gold) 55%, #f0a800);
  border: 3px solid var(--edge);
  box-shadow: 0 5px 0 var(--gold-dark), 0 9px 0 var(--shadow);
  cursor: pointer;
  transition: transform 0.05s steps(2), box-shadow 0.05s steps(2);
}
.btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--gold-dark), 0 4px 0 var(--shadow); }
.btn.secondary {
  color: var(--ink);
  background: linear-gradient(#4b2b78, var(--bg2) 60%, #1a0d2b);
  box-shadow: 0 5px 0 #150a26, 0 9px 0 var(--shadow);
}
.btn.secondary:active { box-shadow: 0 0 0 #150a26, 0 4px 0 var(--shadow); }
.btn.small { min-height: 42px; padding: 10px 14px; font-size: 0.72rem; }
.btn:focus-visible, .icon:focus-visible, .seg:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* ---------------- layers over the canvas ---------------- */

.layer {
  position: fixed;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding-inline: 16px;
  pointer-events: none;
}
.layer > * { pointer-events: auto; }

#gate { bottom: max(13vh, 72px); }
#gate .blink { animation: blink 1.1s steps(2) infinite; }

#cta { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 14px; }

.url {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  color: var(--dim);
  user-select: text;
}

@keyframes blink { 50% { opacity: 0.55; } }

/* ---------------- the transport bar ---------------- */

#bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bar);
  border-top: 2px solid var(--bg2);
  transition: opacity 0.3s steps(3);
}
body.idle #bar { opacity: 0; }

.icon {
  appearance: none;
  flex: none;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--bg2);
  cursor: pointer;
}
.icon:hover { border-color: var(--dim); }
.icon svg { width: 20px; height: 20px; fill: currentColor; shape-rendering: crispEdges; }
.icon .alt { display: none; }
#toggle[data-state="pause"] .main, #sound[data-state="off"] .main { display: none; }
#toggle[data-state="pause"] .alt, #sound[data-state="off"] .alt { display: block; }

#chapters {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 4px;
  height: 40px;
  align-items: center;
}
.seg {
  appearance: none;
  position: relative;
  flex-basis: 0;
  height: 12px;
  padding: 0;
  background: var(--bg2);
  border: 0;
  cursor: pointer;
}
.seg:hover { background: #4b2b78; }
.seg::before { content: ""; position: absolute; inset: -14px 0; }
.seg span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); }

#back { margin-right: auto; }

.readout {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
#shot { color: var(--gold); font-weight: 800; }
#clock { color: var(--dim); }

@media (max-width: 520px) {
  #bar { gap: 8px; padding-inline: 12px; }
  .icon { width: 36px; height: 36px; }
  #full { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #gate .blink { animation: none; }
  .btn, #bar { transition: none; }
}
</style>
</head>
<body>
<canvas id="screen" aria-hidden="true"></canvas>
<h1 class="sr-only">RoGuPong trailer</h1>
<p class="sr-only">A 17-second animated trailer for RoGuPong, a 16-bit pong duel for two phones on the same WiFi, starring RO and GU. In the gameplay shot, click a phone to play the match yourself.</p>

<div id="gate" class="layer">
  <button id="start" class="btn blink" type="button">&#9654; Press start</button>
  <button id="start-muted" class="btn secondary small" type="button">Play without sound</button>
</div>

<div id="cta" class="layer" hidden>
  <div class="row">
    <a class="btn" href="https://gunnargehtab.github.io/RoGuPong/" target="_blank" rel="noopener">Play now</a>
    <button id="try" class="btn secondary" type="button">Try it here</button>
    <button id="replay" class="btn secondary" type="button">Replay</button>
  </div>
  <p class="url">gunnargehtab.github.io/RoGuPong</p>
</div>

<div id="bar" role="group" aria-label="Trailer controls" hidden>
  <button id="toggle" class="icon" type="button" aria-label="Pause" data-state="pause">
    <svg class="main" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h1v8H2zM3 2h2v6H3zM5 3h2v4H5zM7 4h1v2H7z"/></svg>
    <svg class="alt" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg>
  </button>
  <div id="chapters" role="group" aria-label="Shots"></div>
  <button id="back" class="btn secondary small" type="button" hidden>Back to the trailer</button>
  <div class="readout"><span id="shot">Intro</span><span id="clock">0:00 / 0:17</span></div>
  <button id="sound" class="icon" type="button" aria-label="Mute" data-state="on">
    <svg class="main" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3h2v4H1zM3 2h1v6H3zM4 1h1v8H4zM6 4h1v2H6zM7 3h1v1H7zM7 6h1v1H7zM8 2h1v1H8zM8 7h1v1H8zM9 3h1v4H9z"/></svg>
    <svg class="alt" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3h2v4H1zM3 2h1v6H3zM4 1h1v8H4zM6 3h1v1H6zM7 4h1v2H7zM8 3h1v1H8zM6 6h1v1H6zM8 6h1v1H8z"/></svg>
  </button>
  <button id="full" class="icon" type="button" aria-label="Full screen">
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1h3v1H2v2H1zM6 1h3v3H8V2H6zM1 6h1v2h2v1H1zM8 6h1v3H6V8h2z"/></svg>
  </button>
</div>

<noscript><p style="padding:24px">The RoGuPong trailer is drawn by JavaScript.</p></noscript>
<script type="module" src="js/trailer/trailer.js"></script>
</body>
</html>
